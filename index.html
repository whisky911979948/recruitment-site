<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>招聚 · 招聘信息聚合</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 顶部标题区 -->
  <header class="topbar">
    <div class="brand">招聚 <span>· 招聘信息聚合</span></div>
    <p class="subtitle">汇总校招 / 社招 / 实习信息，一处查看，方便筛选</p>
  </header>

  <!-- 搜索 + 筛选工具栏 -->
  <section class="toolbar">
    <input id="searchInput" class="search" type="text" placeholder="搜岗位或公司，比如「实习」「前端」" />

    <select id="cityFilter" class="filter">
      <option value="">全部城市</option>
    </select>

    <select id="categoryFilter" class="filter">
      <option value="">全部行业</option>
    </select>

    <select id="salaryFilter" class="filter">
      <option value="">全部薪资</option>
      <option value="0-10000">1万以下</option>
      <option value="10000-15000">1万 - 1.5万</option>
      <option value="15000-25000">1.5万 - 2.5万</option>
      <option value="25000-999999">2.5万以上</option>
      <option value="perday">按天结算（实习）</option>
    </select>
  </section>

  <!-- 结果计数 -->
  <div id="countBar" class="count-bar">共 0 个岗位</div>

  <!-- 岗位列表：由 app.js 动态填入 -->
  <main id="jobList" class="job-list"></main>

  <footer class="footer">
    数据来自 jobs.js（示例占位）。接真实数据、定时更新、部署上线，下一步带你做。
  </footer>

  <!-- 先加载数据，再加载逻辑；顺序不能反 -->
  <script src="jobs.js"></script>
  <script src="app.js"></script>
</body>
</html>
